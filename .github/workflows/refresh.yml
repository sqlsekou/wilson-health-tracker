name: Data refresh

on:
  schedule:
    # Tuesdays at 13:00 UTC (8am Central during daylight time, 7am in winter).
    # Wilson County Source usually publishes the roundup on Monday.
    - cron: "0 13 * * 2"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Scrape new posts
        id: scrape
        run: python scripts/scrape.py

      - name: Geocode new addresses
        run: python scripts/geocode.py

      - name: Build data files
        id: build
        run: python scripts/build.py

      - name: Commit and push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "Data refresh: ${{ steps.scrape.outputs.new_inspections }} new inspections through ${{ steps.build.outputs.latest_date }}"
          git push
